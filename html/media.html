<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
    <div class="container">
        <h1>📚Calculadora de Médias🧮</h1>
        <p class="subtitulo">Sistema de Notas dos Alunos</p>

        <div id="formulário">
            <label>Nome do Aluno</label>
            <input type="text" id="nome"
            placeholder="Digite o nome do aluno" required>

            <label>Nome da Disciplina:</label>
            <select id="disciplina" required>
                <option value="">Selecione a disciplina</option>
                <option value="FDD">Fundamentos do Design Digital</option>
                <option value="FIDI">Fotografia Digital</option>
                <option value="PRAAI">Projetos de Audio e Video</option>
            </select>
            
            <div class="notas">
                <div>
                <label>1º Bimestre</label>
                <input type="number" id="nota1"
                placeholder="Digite sua nota" required>
                </div>

                <div>
                <label>2º Bimestre</label>
                <input type="number" id="nota2"
                placeholder="Digite sua nota" required>
                </div>

                <div>
                <label>3º Bimestre</label>
                <input type="number" id="nota3"
                placeholder="Digite sua nota" required>
                </div>

                <div>
                <label>4º Bimestre</label>
                <input type="number" id="nota4"
                placeholder="Digite sua nota" required>
                </div>

            </div>

            <button id="calcular" onclick="calcularMedia()">
                Calcular Média
            </button>

            <button id="novocalculo" onclick="calcularNovo()">
                Calcular Novamente
            </button>


            <a href=" " id="link">Calculadora Normal </a> 

            <div id="resultado" class="resultado">
                <p>Preencha os dados acima e clique em calcular média</p>
            </div>



        </div>
    </div>





    <script src="../js/calcular-media.js"></script>
</body>
</html>
